# ==============================================================================
# bncc-pacotes — Deploy de visualização do site na AWS (ECS Express)
# Build da imagem nginx com as páginas estáticas → ECR → force redeploy.
# Roda no push do main. O lançamento oficial usa Cloudflare Pages; este
# workflow serve o ambiente de visualização em bncc.dev (noindex) até o dia D.
# ==============================================================================

name: Deploy AWS site (visualização)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-site
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 851725383889.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -f site/Dockerfile \
            -t $ECR_REGISTRY/bncc-site:$IMAGE_TAG \
            -t $ECR_REGISTRY/bncc-site:latest \
            .
          docker push $ECR_REGISTRY/bncc-site:$IMAGE_TAG
          docker push $ECR_REGISTRY/bncc-site:latest

      - name: Force ECS service redeploy
        run: |
          if aws ecs describe-services --cluster default --services bncc-site 2>/dev/null | grep -q 'ACTIVE'; then
            aws ecs update-service \
              --cluster default \
              --service bncc-site \
              --force-new-deployment \
              --region $AWS_REGION >/dev/null
            echo "Redeploy disparado"
          else
            echo "Service bncc-site ainda não criado; só a imagem foi publicada."
          fi
