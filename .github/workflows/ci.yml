name: ci

on:
  push:
  pull_request:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Testes do pacote PyPI (paridade com o npm)
        run: cd python && uv sync && uv run pytest -q

  # O job "site" foi removido: o site migrou para o repo próprio
  # github.com/bncc-dev/bncc-site (build, CI e deploy vivem lá).
  # A pasta site/ permanece aqui apenas arquivada. Ver site/README.md.
