[project]
name = "bncc"
version = "0.2.0"
description = "A BNCC (Base Nacional Comum Curricular) como dados estruturados e verificados, com API de consulta em português. Inclui o complemento de Computação (1.721 aprendizagens). Dados embutidos, zero dependências, zero rede."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["bncc", "educacao", "base nacional comum curricular", "mec", "habilidades", "curriculo", "brasil"]
authors = [{ name = "bncc.dev (Profy)", email = "marcos@profy.com.br" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.urls]
Homepage = "https://github.com/bncc-dev/bncc-pacotes"
Dados = "https://github.com/bncc-dev/bncc-dados"

[project.optional-dependencies]
pandas = ["pandas>=2"]

[dependency-groups]
dev = ["pytest>=8", "pandas>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bncc"]
