[project]
name = "bncc"
version = "0.3.0"
description = "A BNCC (Base Nacional Comum Curricular) como dados estruturados e verificados, com API de consulta em português. Inclui o complemento de Computação (1.721 aprendizagens). Dados embutidos, zero dependências, zero rede."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# Os JSONs em bncc/dados/ são CC BY 4.0, não MIT: o campo acima descreve o
# código. A divisão está em LICENSE.md, que vai dentro do wheel.
license-files = ["LICENSE.md"]
keywords = ["bncc", "educacao", "base nacional comum curricular", "mec", "habilidades", "curriculo", "brasil"]
authors = [{ name = "bncc.dev (Profy)", email = "contato@bncc.dev" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

[project.urls]
Homepage = "https://bncc.dev"
Codigo = "https://github.com/bncc-dev/bncc-pacotes"
Dados = "https://github.com/bncc-dev/bncc-dados"
Changelog = "https://github.com/bncc-dev/bncc-pacotes/blob/main/CHANGELOG.md"
Issues = "https://github.com/bncc-dev/bncc-pacotes/issues"

[project.optional-dependencies]
pandas = ["pandas>=2"]

[dependency-groups]
dev = ["pytest>=8", "pandas>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bncc"]
