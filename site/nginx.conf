# nginx do deploy de visualização (AWS ECS Express).
# Serve o dist/ estático do Astro. Exposição a robôs autorizada em
# 10/jul/2026 (decisão do time, antecipando o passo 4 do dia D): sem
# X-Robots-Tag; a política de crawl é o public/robots.txt, que dá
# boas-vindas aos crawlers, incluindo os de IA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv text/markdown application/xml;

    charset utf-8;
    charset_types text/plain text/markdown text/csv;

    # versões markdown das páginas (/habilidade/{codigo}.md): sem isto o
    # nginx serviria .md como octet-stream (download) em vez de texto.
    # noindex: são espelhos 1:1 das páginas HTML para consumo por LLMs;
    # a URL canônica (HTML) é a que indexa (fora do sitemap, anunciadas
    # só no llms.txt)
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        add_header X-Robots-Tag "noindex" always;
    }

    # assets do Astro têm hash no nome: cache longo
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
