# nginx do deploy de visualização (AWS ECS Express).
# Serve o dist/ estático do Astro. O X-Robots-Tag protege a fase de
# visualização: nada deste ambiente deve ser indexado (o índice canônico
# nasce no lançamento, quando o site vai para o Cloudflare Pages).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv text/markdown application/xml;

    charset utf-8;
    charset_types text/plain text/markdown text/csv;

    # versões markdown das páginas (/habilidade/{codigo}.md): sem isto o
    # nginx serviria .md como octet-stream (download) em vez de texto
    location ~ \.md$ {
        types { }
        default_type text/markdown;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # assets do Astro têm hash no nome: cache longo
    location /_astro/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
